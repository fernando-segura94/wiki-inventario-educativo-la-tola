    <g transform="translate(1380 243)"><rect width="180" height="254" rx="9" fill="#fff" stroke="#cbd4d9"/><rect width="180" height="7" rx="4" fill="#25465a"/><text x="16" y="38" font-size="15" font-weight="700" fill="#1d394b">1.7 Despliegue</text><text x="16" y="69" font-size="12" fill="#475761"><tspan x="16" dy="0">Lanzamiento autorizado</tspan><tspan x="16" dy="22">Monitoreo y soporte</tspan><tspan x="16" dy="22">Transferencia operativa</tspan></text><text x="16" y="224" font-size="11" fill="#64717a">Evidencia: salida a producción</text></g>
  </g>
  <text x="60" y="560" font-family="Arial,sans-serif" font-size="12" fill="#64717a">Cada paquete se descompone en actividades, responsables, criterios de aceptación y esfuerzo durante la planeación detallada.</text>
