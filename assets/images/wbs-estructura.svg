    <g transform="translate(260 243)"><rect width="180" height="254" rx="9" fill="#fff" stroke="#cbd4d9"/><rect width="180" height="7" rx="4" fill="#55778a"/><text x="16" y="38" font-size="15" font-weight="700" fill="#1d394b">1.2 Descubrimiento</text><text x="16" y="69" font-size="12" fill="#475761"><tspan x="16" dy="0">Procesos actuales</tspan><tspan x="16" dy="22">Requisitos y usuarios</tspan><tspan x="16" dy="22">Catálogo de datos</tspan></text><text x="16" y="224" font-size="11" fill="#64717a">Evidencia: requisitos</text></g>
