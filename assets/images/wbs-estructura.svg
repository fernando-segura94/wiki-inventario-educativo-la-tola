    <g transform="translate(708 243)"><rect width="180" height="254" rx="9" fill="#fff" stroke="#cbd4d9"/><rect width="180" height="7" rx="4" fill="#55778a"/><text x="16" y="38" font-size="15" font-weight="700" fill="#1d394b">1.4 Construcción</text><text x="16" y="69" font-size="12" fill="#475761"><tspan x="16" dy="0">Activos y roles</tspan><tspan x="16" dy="22">Mantenimiento y QR</tspan><tspan x="16" dy="22">Movimientos e informes</tspan></text><text x="16" y="224" font-size="11" fill="#64717a">Evidencia: versión piloto</text></g>
