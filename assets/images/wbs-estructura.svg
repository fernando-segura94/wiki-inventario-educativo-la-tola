<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">WBS del piloto SIGMA Educación La Tola</title>
  <desc id="desc">Desglose del proyecto en siete paquetes: dirección, descubrimiento, diseño, construcción, verificación, migración y despliegue.</desc>
  <rect width="1600" height="620" rx="18" fill="#f4f6f7"/>
  <text x="60" y="57" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1d394b">Estructura de desglose del trabajo</text>
  <text x="60" y="86" font-family="Arial,sans-serif" font-size="15" fill="#64717a">SIGMA Educación La Tola · escenario piloto de una institución</text>
  <rect x="510" y="112" width="580" height="66" rx="10" fill="#25465a"/>
  <text x="800" y="141" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">1.0 · Plataforma de inventario y mantenimiento</text>
  <text x="800" y="161" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#e5edf0">Puesta en operación, documentación y transferencia</text>
