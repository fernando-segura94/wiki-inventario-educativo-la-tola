  <g font-family="Arial,sans-serif" font-size="13" fill="#35434c">
    <text x="42" y="187">Requisitos y alcance</text><text x="42" y="243">Diseño y arquitectura</text><text x="42" y="299">Activos, roles y QR</text><text x="42" y="355">Mantenimiento y reportes</text><text x="42" y="411">Pruebas y seguridad</text><text x="42" y="467">Migración y etiquetas</text><text x="42" y="523">Capacitación y aceptación</text><text x="42" y="579">Despliegue y transferencia</text>
  </g>
