<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 660" role="img" aria-labelledby="title desc">
  <title id="title">Cronograma de referencia de 16 semanas</title>
  <desc id="desc">Diagrama de Gantt con ocho actividades, desde el levantamiento de requisitos hasta la salida a producción.</desc>
  <rect width="1440" height="660" rx="18" fill="#fff"/>
  <text x="42" y="48" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1d394b">Cronograma técnico de referencia · 16 semanas</text>
  <text x="42" y="75" font-family="Arial,sans-serif" font-size="14" fill="#64717a">Duración relativa al inicio formal; las fechas calendario se asignan tras la aprobación institucional.</text>
  <rect x="390" y="108" width="1000" height="46" fill="#edf3f6"/>
